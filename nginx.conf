# ==============================================================================
# TIMEX CERAMIC - NGINX REVERSE PROXY CONFIGURATION (HOSTINGER KVM 2 / UBUNTU)
# ==============================================================================
# Installation path on Ubuntu: /etc/nginx/sites-available/timex-ceramic
# Symlink: ln -s /etc/nginx/sites-available/timex-ceramic /etc/nginx/sites-enabled/
# Test config: nginx -t && systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name timexceramic.com www.timexceramic.com;

    # Maximum file upload size for high-res tile images & PDF catalogues
    client_max_body_size 50M;

    # Gzip Compression for optimal performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Root directory for static assets
    root /var/www/timex-ceramic/public;

    # --------------------------------------------------------------------------
    # 1. Next.js Static Chunks & Build Artifacts (High Cache Header)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        alias /var/www/timex-ceramic/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # 2. Public Uploads, Images & Catalogues (Direct static serving for high speed)
    # --------------------------------------------------------------------------
    location /uploads/ {
        root /var/www/timex-ceramic/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ @backend_proxy;
    }

    location /images/ {
        root /var/www/timex-ceramic/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ @backend_proxy;
    }

    location /catalogue/ {
        root /var/www/timex-ceramic/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ @backend_proxy;
    }

    # --------------------------------------------------------------------------
    # 3. Express Backend API (Port 5001)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_cache_bypass $http_upgrade;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback to backend for any missed dynamic uploads/catalogues
    location @backend_proxy {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. Next.js Frontend Application (Port 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
